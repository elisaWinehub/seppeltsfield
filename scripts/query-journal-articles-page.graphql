query JournalArticlesPage($blogId: ID!, $cursor: String) {
  blog(id: $blogId) {
    id
    handle
    articles(first: 100, after: $cursor) {
      nodes {
        id
        title
        handle
        tags
        publishedAt
        image {
          id
          url
          altText
          width
          height
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
